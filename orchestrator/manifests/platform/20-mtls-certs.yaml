# Phase 2 D — mTLS material for the orchestrator gRPC channel.
#
# Two ways to populate these Secrets:
#
# (A) DEV / bootstrap — from scripts/gen-certs.sh output:
#     kubectl -n practiceengine-platform create secret generic orchestrator-mtls \
#       --from-file=tls.crt=certs/orchestrator.crt \
#       --from-file=tls.key=certs/orchestrator.key \
#       --from-file=ca.crt=certs/ca.crt
#     kubectl -n practiceengine-platform create secret generic practice-core-mtls \
#       --from-file=tls.crt=certs/practice-core-client.crt \
#       --from-file=tls.key=certs/practice-core-client.key \
#       --from-file=ca.crt=certs/ca.crt
#   The gen-certs.sh SANs already include "orchestrator" (the Service DNS
#   name below), so the practice-core client's hostname verification of
#   "orchestrator.practiceengine-platform.svc" passes — see the mtls_test.go
#   TestMTLS_HostnameMismatch_Rejected scenario for the negative case.
#
# (B) PRODUCTION — cert-manager (recommended, no manual rotation):
#   Uncomment the Certificate resources below and install cert-manager
#   first. The self-signed Issuer here is a stand-in for a real CA
#   (Vault PKI / ACM Private CA) behind the same Secret names, so nothing
#   downstream changes.
#
# This file ships the cert-manager path COMMENTED so `kubectl apply -f`
# on a cluster without cert-manager doesn't fail; use route (A) until
# cert-manager is installed.

# ---------------------------------------------------------------------------
# Placeholder Secrets so the Deployments can mount them. Route (A) above
# REPLACES these with real data (kubectl create secret ... will error if
# they already exist — delete first, or use `kubectl create ... --dry-run
# -o yaml | kubectl apply -f -`). Route (B) has cert-manager own them.
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-mtls
  namespace: practiceengine-platform
  annotations:
    practiceengine.dev/populate-with: "scripts/gen-certs.sh -> orchestrator.crt/.key + ca.crt, or cert-manager"
type: kubernetes.io/tls
stringData:
  tls.crt: "" # REPLACE
  tls.key: "" # REPLACE
  ca.crt: "" # REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: practice-core-mtls
  namespace: practiceengine-platform
  annotations:
    practiceengine.dev/populate-with: "scripts/gen-certs.sh -> practice-core-client.crt/.key + ca.crt, or cert-manager"
type: kubernetes.io/tls
stringData:
  tls.crt: "" # REPLACE
  tls.key: "" # REPLACE
  ca.crt: "" # REPLACE
---
