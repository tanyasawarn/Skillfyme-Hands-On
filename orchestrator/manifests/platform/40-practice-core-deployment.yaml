# Phase 2 D — practice-core as an in-cluster Deployment. It is the ONLY
# client the NetworkPolicy (60-networkpolicies.yaml) permits to reach the
# orchestrator's gRPC port, and it presents a client certificate for mTLS.
#
# Its own HTTP API (:3001) is exposed to the web frontend via an Ingress
# or a separate Service — that is out of scope for requirement D, which
# is specifically about the practice-core -> orchestrator gRPC channel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-core
  namespace: practiceengine-platform
  labels:
    app: practice-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-core
  template:
    metadata:
      labels:
        app: practice-core
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: practice-core
          image: practiceengine/practice-core:latest # set to your registry ref
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: practice-core-config, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: practice-core-config, key: REDIS_URL } }
            - name: NATS_URL
              valueFrom: { secretKeyRef: { name: practice-core-config, key: NATS_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: practice-core-config, key: JWT_SECRET } }
            - name: USE_FAKE_ORCHESTRATOR
              value: "false"
            # gRPC target = the orchestrator Service DNS name. This name
            # MUST be in the server cert's SANs (gen-certs.sh already adds
            # "orchestrator"); the client verifies it — see mtls_test.go
            # TestMTLS_HostnameMismatch_Rejected.
            - name: ORCHESTRATOR_GRPC_ADDRESS
              value: "orchestrator.practiceengine-platform.svc:50051"
            - name: ORCHESTRATOR_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: practice-core-config, key: ORCHESTRATOR_SHARED_SECRET } }
            # --- mTLS client side: all three or nothing (base-grpc-client.ts) ---
            - name: ORCHESTRATOR_TLS_CA
              value: /etc/practice-core/mtls/ca.crt
            - name: ORCHESTRATOR_CLIENT_TLS_CERT
              value: /etc/practice-core/mtls/tls.crt
            - name: ORCHESTRATOR_CLIENT_TLS_KEY
              value: /etc/practice-core/mtls/tls.key
          volumeMounts:
            - name: mtls
              mountPath: /etc/practice-core/mtls
              readOnly: true
            - name: contracts
              mountPath: /app/contracts
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: mtls
          secret:
            secretName: practice-core-mtls
        - name: contracts
          configMap:
            name: practice-core-contracts
            optional: true # populate from contracts/*.proto if the image doesn't bundle them
---
apiVersion: v1
kind: Service
metadata:
  name: practice-core
  namespace: practiceengine-platform
  labels:
    app: practice-core
spec:
  type: ClusterIP
  selector:
    app: practice-core
  ports:
    - { name: http, port: 3001, targetPort: http }
