# SUPERSEDED by orchestrator/manifests/platform/60-networkpolicies.yaml
# (Phase 2 D). That directory now carries the REAL, deployable version of
# this policy alongside the in-cluster orchestrator Deployment it attaches
# to, a default-deny-ingress, the practice-core HTTP ingress, and the
# orchestrator egress policy -- as a kustomize base with a live
# verification harness (scripts/d-security-check.sh).
#
# This file is kept only as the historical single-policy sketch. The
# labels (app: orchestrator, app: practice-core) match the real
# Deployments in manifests/platform/, so applying this alone is still
# correct on that topology -- it's just a subset of the full set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-grpc-ingress
  namespace: practiceengine-platform
spec:
  podSelector:
    matchLabels: {app: orchestrator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: practice-core}
      ports:
        - protocol: TCP
          port: 50051 # ORCHESTRATOR_GRPC_PORT, orchestrator/.env.example
