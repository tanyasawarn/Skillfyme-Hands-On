; Phase 3 1.4 / B9. Forgejo config for the local platform Git host.
; Mirrors the production intent: no open signup (accounts are created by
; practice-core via the admin token), token auth, repos retained forever.

APP_NAME = Practice Engine — Projects
RUN_MODE = prod

[server]
DOMAIN           = localhost
HTTP_PORT        = 3000
ROOT_URL         = http://localhost:3300/
SSH_DOMAIN       = localhost
SSH_PORT         = 2222
START_SSH_SERVER = true
DISABLE_SSH      = false
LFS_START_SERVER = true

[service]
; The learner never self-registers. practice-core's git.service.ts creates
; the per-learner user + org + repo through the admin API.
DISABLE_REGISTRATION              = true
REQUIRE_SIGNIN_VIEW               = true
ENABLE_BASIC_AUTHENTICATION       = true
DEFAULT_KEEP_EMAIL_PRIVATE        = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = false
DEFAULT_ENABLE_TIMETRACKING       = false

[repository]
; portfolio value — nothing the platform does deletes a learner repo.
DEFAULT_PRIVATE          = private
DISABLE_MIGRATIONS       = false
DEFAULT_BRANCH           = main
ENABLE_PUSH_CREATE_USER  = false
ENABLE_PUSH_CREATE_ORG   = false

[security]
INSTALL_LOCK   = true
; SECRET_KEY / INTERNAL_TOKEN are generated on first boot and persisted
; to the data volume; do not pin them here.
MIN_PASSWORD_LENGTH = 12

[api]
ENABLE_SWAGGER = true

[cron.git_gc_repos]
; keep housekeeping but never a retention/pruning job.
ENABLED  = true
SCHEDULE = @every 72h

[log]
LEVEL = Info
