# Minimal T1 gVisor proof workload. NOT the real workspace pod — just
# enough to prove the practice-t1 pool actually sandboxes with runsc.
#
#   - runtimeClassName: gvisor      -> the RuntimeClass GKE Sandbox created
#   - nodeSelector tier=t1          -> lands on the sandboxed pool
#   - toleration workload=learner   -> matches the pool taint
#   - restricted-compatible securityContext (no host anything) -> also
#     satisfies GKE Sandbox's own pod constraints
apiVersion: v1
kind: Pod
metadata:
  name: gvisor-smoke
  labels:
    app: gvisor-smoke
    "practiceengine.dev/test": "phase1-cluster-verify"
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  nodeSelector:
    practiceengine.dev/tier: t1
  tolerations:
    - key: workload
      operator: Equal
      value: learner
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits: { cpu: "200m", memory: "128Mi" }
