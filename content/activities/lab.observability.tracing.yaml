id: lab.observability.tracing
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Trace a request across two services with Jaeger
  summary: Instrument a two-hop request so a single trace shows both spans in Jaeger.
  difficulty_level: L3
  estimated_minutes: 30
  locale: en
  authors: [content-team]
  tags: [jaeger, tracing, observability]

curriculum:
  primary_topic: topic.devops.observability-tracing
  courses: [course.devops-with-ai]

skills:
  - skill: observability.tracing
    weight: 1.0
    primary: true
    bloom: analyze

prerequisites:
  hard: [observability.prometheus-advanced]
  soft: [istio.mtls-security]

objectives:
  - Send a trace with two connected spans to Jaeger
  - Query Jaeger's API for traces belonging to a given service
  - Identify which span contributed most to total request latency

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 30
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
    - fixture: fx.jaeger-installed.v1
    - fixture: fx.trace-emitter-script.v1
  cost_budget_usd: 0.03

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Emit and query a two-span trace
    required: true
    instructions_md: |
      Run `~/emit-trace.sh` (provided) to send a trace with a `frontend`
      span and a child `backend` span to Jaeger. Query Jaeger's API for
      traces of service `frontend` and write the returned trace ID to
      `~/trace-id.txt`.
    validators:
      - id: v.trace-id-file-exists
        type: FILE_EXISTS
        run: "~/trace-id.txt"
        expect:
          exists: true
        weight: 0.3
        on_fail: "~/trace-id.txt doesn't exist yet."
      - id: v.trace-queryable-in-jaeger
        type: SHELL_ASSERT
        run: "curl -sf \"http://localhost:16686/api/traces?service=frontend\" | grep -q \"$(cat ~/trace-id.txt)\""
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "The trace ID in trace-id.txt doesn't show up when querying Jaeger's API for service=frontend."
    hints:
      - level: 1
        penalty: 0.02
        text: "A trace ID ties multiple spans (one per service hop) together into one end-to-end view — that's what distributed tracing gives you that per-service logs don't."
      - level: 2
        penalty: 0.08
        text: "curl -sf 'localhost:16686/api/traces?service=frontend' returns JSON with a data[].traceID field."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.75
      task_completion: 0.15
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 9000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.observability.tracing/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
