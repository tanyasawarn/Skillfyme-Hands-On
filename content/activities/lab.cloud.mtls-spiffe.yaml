id: lab.cloud.mtls-spiffe
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Verify workload identity with SPIFFE IDs
  summary: Inspect a mesh-issued SPIFFE identity and confirm it matches the expected workload.
  difficulty_level: L4
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [spiffe, spire, workload-identity, mtls]

curriculum:
  primary_topic: topic.devops.cloud-mtls-spiffe
  courses: [course.devops-with-ai]

skills:
  - skill: cloud.mtls-spiffe
    weight: 1.0
    primary: true
    bloom: analyze

prerequisites:
  hard: [cloud.zero-trust-security]
  soft: [istio.mtls-security]

objectives:
  - Explain what a SPIFFE ID encodes about a workload's identity
  - Inspect a running pod's mesh-issued identity certificate
  - Verify the identity matches the expected trust domain and service account

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 2Gi
    disk: 4Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
    - fixture: fx.istio-installed.v1
    - fixture: fx.backend-pod.v1
  cost_budget_usd: 0.04

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Extract and verify the workload's SPIFFE ID
    required: true
    instructions_md: |
      Extract the `backend` pod's Istio-issued identity certificate and
      write its SPIFFE URI (the `spiffe://...` SAN entry) to
      `~/spiffe-id.txt`.
    validators:
      - id: v.spiffe-id-file-exists
        type: FILE_EXISTS
        run: "~/spiffe-id.txt"
        expect:
          exists: true
        weight: 0.3
        on_fail: "~/spiffe-id.txt doesn't exist yet."
      - id: v.spiffe-id-well-formed
        type: SHELL_ASSERT
        run: "grep -qE '^spiffe://[a-z0-9.-]+/ns/[a-z0-9-]+/sa/[a-z0-9-]+' ~/spiffe-id.txt"
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "The file's content doesn't look like a well-formed SPIFFE ID: spiffe://<trust-domain>/ns/<namespace>/sa/<service-account>."
    hints:
      - level: 1
        penalty: 0.02
        text: "A SPIFFE ID encodes trust domain, namespace, and service account — it's the workload's cryptographically-verifiable identity, not a human-assigned name."
      - level: 2
        penalty: 0.08
        text: "istioctl proxy-config secret backend-<pod-suffix> -o json can dump the cert; look for the SAN with a spiffe:// URI."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.80
      task_completion: 0.10
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 9000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.cloud.mtls-spiffe/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
