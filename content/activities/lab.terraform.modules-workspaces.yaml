id: lab.terraform.modules-workspaces
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Extract a reusable Terraform module
  summary: Refactor an inline resource into a reusable module, then instantiate it twice.
  difficulty_level: L3
  estimated_minutes: 30
  locale: en
  authors: [content-team]
  tags: [terraform, modules, workspaces]

curriculum:
  primary_topic: topic.devops.terraform-modules-workspaces
  courses: [course.devops-with-ai]

skills:
  - skill: terraform.modules-workspaces
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [terraform.state-management]
  soft: []

objectives:
  - Extract a resource block into a reusable module
  - Instantiate the same module twice with different inputs
  - Confirm both instances produce independent resources

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.linux.v1
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  ttl_minutes: 30
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  cost_budget_usd: 0.02

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Extract a local_file module
    required: true
    instructions_md: |
      Create `~/infra/modules/file/main.tf` defining a module that takes
      an input variable `filename` and creates a `local_file` resource at
      that path with fixed content `"module output"`.
    validators:
      - id: v.module-file-exists
        type: FILE_EXISTS
        run: "~/infra/modules/file/main.tf"
        expect:
          exists: true
        weight: 0.3
        on_fail: "~/infra/modules/file/main.tf doesn't exist yet."
      - id: v.module-has-variable
        type: FILE_CONTENT
        run: "~/infra/modules/file/main.tf"
        expect:
          contains: "variable \"filename\""
        weight: 0.7
        on_fail: "The module should declare a variable \"filename\" input."
    hints:
      - level: 1
        penalty: 0.02
        text: "A module is just a directory with its own .tf files — any directory referenced via a `module` block becomes reusable."
      - level: 2
        penalty: 0.06
        text: "variable \"filename\" { type = string }; resource \"local_file\" \"this\" { filename = var.filename, content = \"module output\" }."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Instantiate the module twice
    required: true
    instructions_md: |
      In `~/infra/main.tf`, instantiate the module twice with different
      `filename` values: `/tmp/module-a.txt` and `/tmp/module-b.txt`. Apply
      and confirm both files exist.
    validators:
      - id: v.file-a-exists
        type: FILE_EXISTS
        run: "/tmp/module-a.txt"
        expect:
          exists: true
        weight: 0.5
        on_fail: "/tmp/module-a.txt doesn't exist — did both module instances apply?"
      - id: v.file-b-exists
        type: FILE_EXISTS
        run: "/tmp/module-b.txt"
        expect:
          exists: true
        weight: 0.5
        on_fail: "/tmp/module-b.txt doesn't exist."
    hints:
      - level: 1
        penalty: 0.02
        text: "Each `module \"name\" { source = \"./modules/file\", filename = \"...\" }` block is an independent instance with its own state address."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.70
      task_completion: 0.20
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 9000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.terraform.modules-workspaces/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
