id: lab.sre.write-a-postmortem
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Write a blameless postmortem from a given incident timeline
  summary: Given a fixed set of facts about a resolved incident, write a complete postmortem covering root cause, detection, timeline, remediation, and prevention.
  difficulty_level: L2
  estimated_minutes: 30
  locale: en
  authors: [content-team]
  tags: [sre, postmortem, incident-response]

curriculum:
  primary_topic: topic.sre.postmortems
  courses: [course.sre]

skills:
  - skill: sre.postmortem-authorship
    weight: 1.0
    primary: true
    bloom: create

prerequisites:
  hard: [sre.incident-response-process]
  soft: [sre.slo-error-budgets]

objectives:
  - Write a root-cause statement that names the actual causal mechanism, not just a symptom
  - Reconstruct an accurate timeline from a set of raw facts
  - Propose a specific, actionable prevention step tied directly to the root cause

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.linux.v1
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  ttl_minutes: 35
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.postmortem-incident-facts.v1
  cost_budget_usd: 0.02

surfaces: [terminal, editor]

# This lab has no fault injection or production sim scenario -- it's a
# deliberately isolated writing exercise, given a fixed set of facts
# (seeded via fixture, not generated by a live incident) so the learner
# can focus entirely on postmortem craft without also having to diagnose
# a live system. sim.sre.checkout-latency-incident (PRODUCTION_SIM) is
# where postmortem-authorship is exercised end-to-end alongside real
# diagnosis; this lab is the isolated-skill-practice complement to it,
# matching doc §1.3.1's Guided Lab framing ("convert declarative
# knowledge into procedural fluency with low failure cost") applied to a
# writing skill rather than a terminal skill.
tasks:
  - key: t1
    title: Read the incident facts
    required: true
    instructions_md: |
      `/workspace/incident-facts.md` contains the raw facts of a resolved
      incident: what broke, when it was detected, what commands were run
      to diagnose it, and what fixed it. Read it before starting your
      postmortem -- you'll need to reference specific facts from it, not
      general SRE knowledge.
    validators:
      - id: v.facts-file-exists
        type: FILE_EXISTS
        run: "/workspace/incident-facts.md"
        expect:
          exists: true
        weight: 1.0
        severity: BLOCKING
        on_fail: "incident-facts.md should already be present at /workspace/incident-facts.md from the lab's fixture -- if it's missing, the environment didn't seed correctly."
    hints: []
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

artifacts_required:
  - key: incident-note
    type: MARKDOWN
    rubric: rub.incident-note.v2

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.40
      task_completion: 0.40
      efficiency: 0.20

ai_mentor:
  persona: tutor
  max_hints: 4
  token_budget: 6000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.sre.write-a-postmortem/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
