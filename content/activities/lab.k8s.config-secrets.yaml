id: lab.k8s.config-secrets
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Inject config and secrets into a Pod
  summary: Use a ConfigMap for app settings and a Secret for sensitive data, mounted as env vars.
  difficulty_level: L2
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [kubernetes, configmap, secrets]

curriculum:
  primary_topic: topic.devops.k8s.config-secrets
  courses: [course.devops-with-ai]

skills:
  - skill: k8s.config-secrets
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [k8s.services]
  soft: []

objectives:
  - Create a ConfigMap holding non-sensitive application settings
  - Create a Secret holding a sensitive value, base64-encoded at rest
  - Inject both into a Pod as environment variables

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
  cost_budget_usd: 0.03

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Create a ConfigMap and a Secret
    required: true
    instructions_md: |
      Create a ConfigMap named `app-config` with key `LOG_LEVEL=info`,
      and a Secret named `app-secret` with key `API_KEY=demo-key-123`.
    validators:
      - id: v.configmap-exists
        type: K8S_ASSERT
        run: "kubectl get configmap app-config -o jsonpath='{.data.LOG_LEVEL}'"
        expect:
          jsonpath: "$"
          op: "eq"
          value: "info"
        weight: 0.5
        on_fail: "ConfigMap app-config with LOG_LEVEL=info not found."
      - id: v.secret-exists
        type: K8S_ASSERT
        run: "kubectl get secret app-secret -o jsonpath='{.data.API_KEY}' | base64 -d"
        expect:
          jsonpath: "$"
          op: "eq"
          value: "demo-key-123"
        weight: 0.5
        on_fail: "Secret app-secret with API_KEY=demo-key-123 not found."
    hints:
      - level: 1
        penalty: 0.02
        text: "`kubectl create configmap` and `kubectl create secret generic` both accept --from-literal=key=value."
      - level: 2
        penalty: 0.08
        text: "kubectl create configmap app-config --from-literal=LOG_LEVEL=info; kubectl create secret generic app-secret --from-literal=API_KEY=demo-key-123."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Inject both into a Pod as env vars
    required: true
    instructions_md: |
      Create a Pod named `config-demo` (any simple image) that injects
      `LOG_LEVEL` from app-config and `API_KEY` from app-secret as
      environment variables.
    validators:
      - id: v.pod-has-configmap-env
        type: K8S_ASSERT
        run: "kubectl exec config-demo -- printenv LOG_LEVEL"
        expect:
          jsonpath: "$"
          op: "eq"
          value: "info"
        weight: 0.5
        on_fail: "config-demo's LOG_LEVEL env var isn't set from app-config."
      - id: v.pod-has-secret-env
        type: K8S_ASSERT
        run: "kubectl exec config-demo -- printenv API_KEY"
        expect:
          jsonpath: "$"
          op: "eq"
          value: "demo-key-123"
        weight: 0.5
        on_fail: "config-demo's API_KEY env var isn't set from app-secret."
    hints:
      - level: 1
        penalty: 0.02
        text: "Use envFrom or env.valueFrom.configMapKeyRef / secretKeyRef in the container spec."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.70
      task_completion: 0.20
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.k8s.config-secrets/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
