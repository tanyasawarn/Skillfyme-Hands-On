id: lab.observability.prometheus-advanced
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Write a Prometheus recording rule
  summary: Author a recording rule that pre-computes an aggregation, and confirm it's evaluated.
  difficulty_level: L3
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [prometheus, recording-rules, advanced]

curriculum:
  primary_topic: topic.devops.observability-prometheus-advanced
  courses: [course.devops-with-ai]

skills:
  - skill: observability.prometheus-advanced
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [observability.elk-basics]
  soft: []

objectives:
  - Author a Prometheus recording rule file
  - Reference the rule file from prometheus.yml
  - Confirm the recorded series appears in query results

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
    - fixture: fx.prometheus-installed.v1
  cost_budget_usd: 0.03

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Author and load a recording rule
    required: true
    instructions_md: |
      Write a recording rule file defining `job:up:avg` as the average of
      the `up` metric. Reload Prometheus and confirm querying
      `job:up:avg` returns a result.
    validators:
      - id: v.recorded-series-queryable
        type: SHELL_ASSERT
        run: "curl -sf 'http://localhost:9090/api/v1/query?query=job:up:avg' | grep -q '\"result\":\\[{'"
        expect:
          exit_code: 0
        weight: 1.0
        on_fail: "Querying job:up:avg returned no results — check the rule file syntax and that Prometheus was reloaded (POST /-/reload)."
    hints:
      - level: 1
        penalty: 0.03
        text: "A recording rule is groups: [{name: ..., rules: [{record: job:up:avg, expr: avg(up)}]}] in a rules file referenced by rule_files: in prometheus.yml."
      - level: 2
        penalty: 0.1
        text: "After editing the config, reload with `curl -X POST localhost:9090/-/reload` rather than restarting the whole process."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.80
      task_completion: 0.10
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.observability.prometheus-advanced/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
