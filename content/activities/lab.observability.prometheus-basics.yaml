id: lab.observability.prometheus-basics
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Query metrics with PromQL
  summary: Deploy a metrics target and write PromQL queries to answer real questions about it.
  difficulty_level: L2
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [prometheus, monitoring]

curriculum:
  primary_topic: topic.devops.observability-prometheus-basics
  courses: [course.devops-with-ai]

skills:
  - skill: observability.prometheus-basics
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [k8s.deployments]
  soft: []

objectives:
  - Confirm Prometheus is scraping a target successfully
  - Write a PromQL instant query for a specific metric
  - Write a PromQL query using a rate() function over a time window

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
    - fixture: fx.prometheus-installed.v1
  cost_budget_usd: 0.03

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Query current memory usage
    required: true
    instructions_md: |
      Using the Prometheus HTTP API, query `process_resident_memory_bytes`
      and write the result to `~/mem-query.json`.
    validators:
      - id: v.query-result-exists
        type: FILE_EXISTS
        run: "~/mem-query.json"
        expect:
          exists: true
        weight: 0.3
        on_fail: "~/mem-query.json doesn't exist yet."
      - id: v.query-result-has-data
        type: SHELL_JSON
        run: "cat ~/mem-query.json"
        expect:
          jsonpath: "$.status"
          op: "eq"
          value: "success"
        weight: 0.7
        on_fail: "The query result doesn't show status: success — check the query endpoint and metric name."
    hints:
      - level: 1
        penalty: 0.02
        text: "Prometheus's query API is at /api/v1/query?query=<promql>."
      - level: 2
        penalty: 0.06
        text: "curl 'http://localhost:9090/api/v1/query?query=process_resident_memory_bytes' > ~/mem-query.json"
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.75
      task_completion: 0.15
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.observability.prometheus-basics/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
