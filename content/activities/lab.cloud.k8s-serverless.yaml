id: lab.cloud.k8s-serverless
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Choose Kubernetes vs a scale-to-zero Job for a workload
  summary: Compare a long-running Deployment against a scale-to-zero Job for a batch task.
  difficulty_level: L2
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [cloud-native, kubernetes, serverless]

curriculum:
  primary_topic: topic.devops.cloud-k8s-serverless
  courses: [course.devops-with-ai]

skills:
  - skill: cloud.k8s-serverless
    weight: 1.0
    primary: true
    bloom: analyze

prerequisites:
  hard: [cloud.twelve-factor]
  soft: [k8s.deployments]

objectives:
  - Distinguish an always-on Deployment from an on-demand Job
  - Author a Kubernetes Job for a finite batch task instead of a Deployment
  - Verify the Job completes and does not keep running indefinitely

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.k8s-single-node.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.k3s-ready.v1
  cost_budget_usd: 0.03

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Author a batch Job instead of a Deployment
    required: true
    instructions_md: |
      A finite task (compute a checksum and exit) shouldn't run as an
      always-on Deployment. Author a Kubernetes Job named `checksum-job`
      that runs the task once and completes.
    validators:
      - id: v.job-exists
        type: K8S_ASSERT
        run: "kubectl get job checksum-job -o jsonpath='{.metadata.name}'"
        expect:
          jsonpath: "$"
          op: "eq"
          value: "checksum-job"
        weight: 0.3
        on_fail: "Job checksum-job doesn't exist."
      - id: v.job-completed
        type: K8S_ASSERT
        run: "kubectl get job checksum-job -o jsonpath='{.status.succeeded}'"
        expect:
          jsonpath: "$"
          op: "eq"
          value: 1
        weight: 0.7
        on_fail: "checksum-job hasn't completed successfully yet. A Job should run to completion and stop, unlike a Deployment."
    hints:
      - level: 1
        penalty: 0.02
        text: "A Job runs its Pod(s) to completion once, then stops — no restartPolicy: Always, and no replica reconciliation like a Deployment."
      - level: 2
        penalty: 0.06
        text: "kind: Job, spec.template.spec.restartPolicy: Never, and any command that exits 0."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.75
      task_completion: 0.15
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.cloud.k8s-serverless/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
