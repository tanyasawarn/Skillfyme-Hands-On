id: lab.linux.navigate-filesystem
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Navigate and manage files on Linux
  summary: Use core shell commands to explore, create, and manipulate files and directories.
  difficulty_level: L1
  estimated_minutes: 20
  locale: en
  authors: [content-team]
  tags: [linux, cli, fundamentals]

curriculum:
  primary_topic: topic.devops.linux-fundamentals
  courses: [course.devops-with-ai]

skills:
  - skill: linux.cli
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: []
  soft: []

objectives:
  - Navigate the filesystem using absolute and relative paths
  - Create, move, and remove files and directories
  - Inspect file permissions and ownership

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.linux.v1
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  ttl_minutes: 30
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  cost_budget_usd: 0.02

surfaces: [terminal]

tasks:
  - key: t1
    title: Set up a project directory tree
    required: true
    instructions_md: |
      In your home directory, create a directory named `project` with two
      subdirectories inside it: `src` and `docs`.
    validators:
      - id: v.project-dir-exists
        type: SHELL_ASSERT
        run: "test -d ~/project"
        expect:
          exit_code: 0
        weight: 0.4
        on_fail: "No `project` directory found in your home directory. Use `mkdir project`."
      - id: v.subdirs-exist
        type: SHELL_ASSERT
        run: "test -d ~/project/src && test -d ~/project/docs"
        expect:
          exit_code: 0
        weight: 0.6
        on_fail: "Both `project/src` and `project/docs` must exist. `mkdir -p project/{src,docs}` creates both at once."
    hints:
      - level: 1
        penalty: 0.02
        text: "`mkdir` creates directories; `mkdir -p` creates nested paths in one call."
      - level: 2
        penalty: 0.05
        text: "Run `mkdir -p ~/project/src ~/project/docs`."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Set correct file permissions
    required: true
    instructions_md: |
      Create a file `project/deploy.sh` and make it executable by the
      owner only (no group/other execute permission).
    validators:
      - id: v.script-exists
        type: FILE_EXISTS
        run: "~/project/deploy.sh"
        expect:
          exists: true
        weight: 0.3
        on_fail: "project/deploy.sh doesn't exist yet. Create it with `touch` first."
      - id: v.script-executable-owner-only
        type: SHELL_ASSERT
        run: "stat -c '%a' ~/project/deploy.sh | grep -qE '^7[0-6][0-6]$'"
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "The file should be executable by you but not group/other. Try `chmod 700 project/deploy.sh` or `chmod 744`."
    hints:
      - level: 1
        penalty: 0.02
        text: "`chmod` changes permissions; the first digit controls the owner's rights."
      - level: 2
        penalty: 0.05
        text: "Run `chmod 700 ~/project/deploy.sh`."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.70
      task_completion: 0.20
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.linux.navigate-filesystem/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
