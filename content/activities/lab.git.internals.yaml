id: lab.git.internals
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Explore Git's object model and rewrite history with rebase
  summary: Inspect blobs/trees/commits directly, then squash commits with an interactive rebase.
  difficulty_level: L3
  estimated_minutes: 30
  locale: en
  authors: [content-team]
  tags: [git, internals, advanced]

curriculum:
  primary_topic: topic.devops.git-internals
  courses: [course.devops-with-ai]

skills:
  - skill: git.internals
    weight: 1.0
    primary: true
    bloom: analyze

prerequisites:
  hard: [git.branching-strategies]
  soft: []

objectives:
  - Inspect a Git commit's underlying tree and blob objects
  - Understand how Git content-addresses objects by hash
  - Squash multiple commits into one via interactive rebase

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.linux.v1
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  ttl_minutes: 35
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.git-repo-three-commits.v1
  cost_budget_usd: 0.02

surfaces: [terminal]

tasks:
  - key: t1
    title: Inspect a commit's tree object
    required: true
    instructions_md: |
      Write the tree hash of HEAD's commit to `~/tree-hash.txt` using
      `git cat-file` or `git rev-parse`.
    validators:
      - id: v.tree-hash-file-exists
        type: FILE_EXISTS
        run: "~/tree-hash.txt"
        expect:
          exists: true
        weight: 0.3
        on_fail: "~/tree-hash.txt doesn't exist yet."
      - id: v.tree-hash-correct
        type: SHELL_ASSERT
        run: "cd ~/repo && [ \"$(cat ~/tree-hash.txt)\" = \"$(git rev-parse HEAD^{tree})\" ]"
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "The hash in tree-hash.txt doesn't match HEAD's actual tree object. Try `git rev-parse HEAD^{tree}`."
    hints:
      - level: 1
        penalty: 0.02
        text: "Every commit points to exactly one tree object representing the full directory snapshot."
      - level: 2
        penalty: 0.06
        text: "Run `git rev-parse HEAD^{tree} > ~/tree-hash.txt` from inside the repo."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Squash three commits into one
    required: true
    instructions_md: |
      The repo has 3 commits on top of the initial commit. Use `git rebase
      -i` to squash all 3 into a single commit, keeping the repo's initial
      commit unchanged.
    validators:
      - id: v.exactly-two-commits-remain
        type: SHELL_ASSERT
        run: "cd ~/repo && test $(git log --oneline | wc -l) -eq 2"
        expect:
          exit_code: 0
        weight: 1.0
        on_fail: "Expected exactly 2 commits total (the original initial commit plus your one squashed commit). Found a different count."
    hints:
      - level: 1
        penalty: 0.03
        text: "`git rebase -i HEAD~3` opens an editor listing the last 3 commits — change `pick` to `squash` (or `s`) on all but the first."
      - level: 2
        penalty: 0.08
        text: "In the rebase todo list, keep the first line as `pick`, change the other two lines to `squash`, save and close."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.75
      task_completion: 0.15
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 9000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.git.internals/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
