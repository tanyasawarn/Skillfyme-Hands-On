id: lab.devops.gitops-evolution
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: From a manual deploy script to a GitOps manifest
  summary: Refactor an imperative deploy script into a declarative, Git-tracked manifest.
  difficulty_level: L2
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [devops, gitops, git]

curriculum:
  primary_topic: topic.devops.gitops-evolution
  courses: [course.devops-with-ai]

skills:
  - skill: devops.gitops-evolution
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [linux.cli]
  soft: [devops.fundamentals]

objectives:
  - Distinguish an imperative deploy script from a declarative manifest
  - Author a declarative YAML manifest describing desired application state
  - Track the manifest under version control as the source of truth

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.linux.v1
  resources:
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
  ttl_minutes: 30
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  seed:
    - fixture: fx.deploy-script.v1
  cost_budget_usd: 0.02

surfaces: [terminal, editor]

tasks:
  - key: t1
    title: Author a declarative manifest
    required: true
    instructions_md: |
      The imperative script at `~/app/deploy.sh` runs a service with
      hardcoded flags. Author `~/app/app.yaml` describing the same desired
      state declaratively: keys `name: sample-app`, `replicas: 2`,
      `image: sample-app:v1`.
    validators:
      - id: v.manifest-exists
        type: FILE_EXISTS
        run: "~/app/app.yaml"
        expect:
          exists: true
        weight: 0.2
        on_fail: "~/app/app.yaml doesn't exist yet."
      - id: v.manifest-parses
        type: FILE_PARSE
        run: "~/app/app.yaml"
        expect:
          format: yaml
        weight: 0.3
        on_fail: "app.yaml isn't valid YAML. Check indentation and colons."
      - id: v.manifest-has-required-keys
        type: FILE_CONTENT
        run: "~/app/app.yaml"
        expect:
          contains_all: ["name: sample-app", "replicas: 2", "image: sample-app:v1"]
        weight: 0.5
        on_fail: "app.yaml is missing one of the required keys: name, replicas, or image."
    hints:
      - level: 1
        penalty: 0.02
        text: "A declarative manifest states the desired end state, not the steps to get there."
      - level: 2
        penalty: 0.06
        text: "Write three top-level keys: name, replicas, image, with the exact values given in the instructions."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Commit the manifest as the source of truth
    required: true
    instructions_md: |
      Initialise a Git repo in `~/app`, and commit `app.yaml` with the
      message "Add declarative app manifest".
    validators:
      - id: v.git-repo-initialised
        type: SHELL_ASSERT
        run: "cd ~/app && git rev-parse --is-inside-work-tree"
        expect:
          exit_code: 0
        weight: 0.3
        on_fail: "~/app isn't a Git repository yet. Run `git init` inside it."
      - id: v.manifest-committed
        type: SHELL_ASSERT
        run: "cd ~/app && git log --oneline -- app.yaml"
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "app.yaml doesn't have a commit yet. `git add app.yaml && git commit -m \"...\"`."
    hints:
      - level: 1
        penalty: 0.02
        text: "GitOps means the Git history IS the deployment history."
      - level: 2
        penalty: 0.05
        text: "Run `git init`, then `git add app.yaml`, then `git commit -m \"Add declarative app manifest\"`."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.70
      task_completion: 0.20
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.devops.gitops-evolution/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
