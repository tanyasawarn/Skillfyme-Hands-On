id: lab.docker.swarm
version: 1
mode: GUIDED_LAB
status: DRAFT

meta:
  title: Deploy a scaled service with Docker Swarm
  summary: Initialise a Swarm and deploy a replicated service across the intended replica count.
  difficulty_level: L2
  estimated_minutes: 25
  locale: en
  authors: [content-team]
  tags: [docker, swarm, orchestration]

curriculum:
  primary_topic: topic.devops.docker-swarm
  courses: [course.devops-with-ai]

skills:
  - skill: docker.swarm
    weight: 1.0
    primary: true
    bloom: apply

prerequisites:
  hard: [docker.networking]
  soft: []

objectives:
  - Initialise a single-node Swarm
  - Deploy a service with a target replica count
  - Scale a running service up

environment:
  tier: SHARED_CONTAINER
  blueprint: bp.docker.v1
  resources:
    cpu: "1"
    memory: 1.5Gi
    disk: 3Gi
  ttl_minutes: 25
  idle_timeout_minutes: 10
  network_policy: egress-allowlist-registry
  cost_budget_usd: 0.03

surfaces: [terminal]

tasks:
  - key: t1
    title: Initialise the Swarm
    required: true
    instructions_md: |
      Initialise Docker Swarm mode on this node.
    validators:
      - id: v.swarm-active
        type: SHELL_ASSERT
        run: "docker info --format '{{.Swarm.LocalNodeState}}'"
        expect:
          exit_code: 0
          stdout_contains: "active"
        weight: 1.0
        on_fail: "Swarm mode isn't active. Run `docker swarm init`."
    hints:
      - level: 1
        penalty: 0.02
        text: "`docker swarm init` bootstraps this node as a Swarm manager."
    solution_apply: scripts/t1_apply.sh
    telemetry_signals: [command_count, time_to_first_success]

  - key: t2
    title: Deploy and scale a replicated service
    required: true
    instructions_md: |
      Create a service named `web` from `httpd:alpine` with 2 replicas,
      then scale it to 4 replicas.
    validators:
      - id: v.service-exists
        type: SHELL_ASSERT
        run: "docker service inspect web"
        expect:
          exit_code: 0
        weight: 0.3
        on_fail: "No service named web found. Run `docker service create --name web --replicas 2 httpd:alpine`."
      - id: v.service-scaled-to-four
        type: SHELL_ASSERT
        run: "docker service inspect web --format '{{.Spec.Mode.Replicated.Replicas}}' | grep -q '^4$'"
        expect:
          exit_code: 0
        weight: 0.7
        on_fail: "Service web should be scaled to 4 replicas. Run `docker service scale web=4`."
    hints:
      - level: 1
        penalty: 0.02
        text: "`docker service create --replicas N` sets the initial count; `docker service scale <name>=N` changes it later."
      - level: 2
        penalty: 0.08
        text: "First `docker service create --name web --replicas 2 httpd:alpine`, then `docker service scale web=4`."
    solution_apply: scripts/t2_apply.sh
    telemetry_signals: [command_count]

completion:
  rule: ALL_REQUIRED_TASKS_PASS
  min_score: 0.70

scoring:
  profile: sp.guided-lab.default
  overrides:
    weights:
      technical_correctness: 0.70
      task_completion: 0.20
      efficiency: 0.10

ai_mentor:
  persona: tutor
  max_hints: 6
  token_budget: 8000
  solution_visibility: HIDDEN
  policy: policy.lab.socratic.v1

reference_solution:
  repo_path: solutions/lab.docker.swarm/
  visibility: AFTER_PASS_OR_EXHAUST

lifecycle:
  resume_window_days: 7
  max_attempts: null
  retire_after: null
