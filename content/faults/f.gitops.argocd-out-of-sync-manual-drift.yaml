id: f.gitops.argocd-out-of-sync-manual-drift
version: 2
title: Cluster state diverges from Git because auto-sync was disabled
summary: Someone applied a manual kubectl change directly to the cluster, and Argo CD's auto-sync was previously turned off, so the drift is never self-healed.

targets: [gitops.argocd]
symptom_class: OutOfSync
skills_probed: [gitops.fluxcd-argocd]

# v2 diagnostic path corrected against the real execution mechanism
# (orchestrator/internal/faultinjection/handlers_batch16.go, backed by
# fx.argocd-minimal.v1 -- a real Argo CD "core install," no
# argocd-server/UI): this environment has no argocd CLI or UI to run
# `argocd app diff` against, only the real Application CRD object
# itself -- `kubectl get application <name> -o yaml` exposes the exact
# same information (status.sync.status, status.conditions,
# spec.syncPolicy.automated) the CLI would render, since the CLI is
# itself just a client reading this same object. Confirmed live this
# session: a real application-controller reconciliation loop populates
# these fields for a genuine drift it detects but (with automated
# disabled) does not revert.
canonical_diagnostic_path:
  - "kubectl get application <name> -n argocd -o yaml → status.sync.status shows OutOfSync"
  - "kubectl get application <name> -n argocd -o yaml → status.conditions / diff the live object against the Git-declared manifest"
  - "check spec.syncPolicy.automated → confirm it's absent/disabled"

expected_fix_class: [re_enable_auto_sync, manual_sync_to_reconcile]
detectability: high
mean_time_to_diagnose_minutes: 5

params_schema:
  application:
    type: string
    description: Name of the target Argo CD Application.

reversible: true
min_tier: T2_ISOLATED_MICROVM
