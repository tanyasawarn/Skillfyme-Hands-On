# Implemented against the real nektos/act workflow-execution engine
# (fx.dind-workspace.v1) -- a documented, API-compatible substitute for
# GitHub's own Actions runner (no official GitHub-hosted execution
# target exists for this platform to run against). act parses and
# executes real workflow_call/secrets: YAML exactly per the GitHub
# Actions schema and runs real job containers, so the reusable-workflow
# + secrets mechanism this fault exercises is genuine, not simulated --
# live-verified this session: a caller workflow that omits secrets:
# genuinely fails with a real empty-secret error from inside the job
# container, while an identical caller that passes the secret succeeds.
id: f.github.actions-secret-not-passed
version: 2
title: A required secret isn't available to a reusable workflow's called job
summary: A workflow calls a reusable workflow but forgets to pass a required secret explicitly, so the called job fails auth silently.

targets: [github.actions]
symptom_class: AuthFailureInCI
skills_probed: [github.actions-workflows, cicd.troubleshooting]

canonical_diagnostic_path:
  - "check the failing job's log → see an auth/401 error against an external service"
  - "check the calling workflow's `uses:` block → confirm whether `secrets:` was passed"
  - "check the reusable workflow's `on.workflow_call.secrets` declaration → compare required vs. passed"

expected_fix_class: [pass_secret_explicitly, use_secrets_inherit]
detectability: low
mean_time_to_diagnose_minutes: 10

params_schema:
  workflow:
    type: string
    description: Name of the calling workflow file.
  missing_secret:
    type: string
    description: Name of the secret that should be omitted.

reversible: true
min_tier: T1_SHARED_CONTAINER
handler_implemented: true
