# v2: the handler now seeds a realistic, non-empty allow-list (a
# couple of legitimate dependencies) before omitting missing_dependency
# from it, rather than layering an extra "block" policy on top of
# whatever allow-rules already existed. Live-verified against a real
# netpol-enforcing cluster: K8s NetworkPolicy has no deny primitive
# (multiple policies selecting the same pods union their allows), so a
# v1-style additive "block" policy can never override a pre-existing
# allow-rule for the same target -- only an allow-list that never
# included the dependency in the first place reproduces this symptom.
# Added the optional known_dependencies param to params_schema.
id: f.k8s.networkpolicy-overblocks-traffic
version: 2
title: Default-deny NetworkPolicy blocks a legitimate dependency the allow-list forgot
summary: A zero-trust default-deny NetworkPolicy was applied, but the accompanying allow-rule forgot one legitimate service-to-service dependency.

targets: [k8s.networkpolicy]
symptom_class: ConnectionTimeout
skills_probed: [cloud.zero-trust-security, k8s.troubleshooting]

canonical_diagnostic_path:
  - "curl from the blocked source → times out, not refused (default-deny signature)"
  - "kubectl get networkpolicy -o yaml → inspect the allow rule's podSelector/ports"
  - "compare the source pod's labels against what the allow rule actually matches"

expected_fix_class: [add_missing_allow_rule, fix_podselector_labels]
detectability: medium
mean_time_to_diagnose_minutes: 10

params_schema:
  namespace:
    type: string
    description: Target namespace with the default-deny policy.
  missing_dependency:
    type: string
    description: The service dependency the allow-list should omit.
  known_dependencies:
    type: string
    description: Optional comma-separated app labels the allow-list DOES cover, simulating the rest of a real platform team's allow-list. Defaults to a couple of plausible peers.

reversible: true
min_tier: T1_SHARED_CONTAINER
handler_implemented: true
