name: practice-engine

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: practice_engine
    ports:
      - "5433:5432"   # host 5432 is taken by a native Postgres install; container stays on 5432 internally
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Dev B's schemas (content/learner/attempt/skill/admin) + the empty
      # env/billing skeleton. Files 0000_*..0009_*. Dev A's env/billing
      # tables are applied separately by the db-migrate-orchestrator
      # one-shot below (initdb.d can't take sibling file mounts once this
      # directory mount owns the path, and the two migration sets have a
      # 0001_/0002_ basename collision anyway).
      - ./practice-core/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring

  # Local image registry (doc §5.2 image strategy, M1.11): a real place
  # to build+push the workspace base images to, instead of the
  # placeholder bare ubuntu:24.04 every environment used until now. Plain
  # `registry:2`, no TLS/auth -- k3s's containerd is told to trust it as
  # plain-HTTP via k3s-registries.yaml below, which is the standard way
  # to run an insecure local registry for dev (a real deployment would
  # use a real registry with auth + TLS + a pull-through cache instead).
  registry:
    image: registry:2
    ports:
      # Host port 5001, not 5000 -- macOS's AirPlay Receiver (ControlCenter)
      # squats on 5000 by default, confirmed live (`lsof -i :5000` showed
      # it holding the port). Internal container port stays 5000, which is
      # what matters for k3s's containerd (it resolves `registry:5000` via
      # compose DNS on the shared network, never touching the host port).
      - "5001:5000"
    volumes:
      - registry_data:/var/lib/registry
    profiles: ["dev-a", "full", "app"]

  # S3-compatible object storage for session recordings (doc §5.4 "record
  # asciicast to S3", PLAN.md M1.5) -- MinIO speaks the real S3 API, so
  # orchestrator/internal/telemetry.S3RecordingSink's client code is
  # identical to what points at real AWS S3 in a real deployment; only
  # S3_ENDPOINT_URL (orchestrator/.env.example) differs. Root credentials
  # are dev-only defaults, same trust level as postgres's practice/practice
  # above -- rotate before any non-local deployment.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: practice
      MINIO_ROOT_PASSWORD: practice-dev-only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["dev-a", "full", "app"]

  # One-shot job creating the recordings bucket on startup -- MinIO
  # doesn't auto-create buckets, and the orchestrator's S3RecordingSink
  # assumes RECORDING_S3_BUCKET already exists (matches real S3's own
  # "buckets are provisioned out-of-band" convention, doc §4.3's
  # lifecycle-policy framing implies a pre-existing bucket with a
  # retention policy attached, not one created ad hoc by application
  # code).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 practice practice-dev-only &&
      mc mb --ignore-existing local/practice-recordings
      "
    profiles: ["dev-a", "full", "app"]

  # Single-node k3s for Dev A's early T1 work (doc §5.2 workhorse tier).
  # Not required for Dev B's Phase 1 milestones except where Content CI
  # needs a real provision target (§3.5 step 2) — until Dev A's
  # Orchestrator is live, Dev B builds against the fake Orchestrator
  # server instead (see PLAN.md "both devs build against the frozen
  # contract from day one using fakes").
  k3s:
    image: rancher/k3s:latest
    privileged: true
    # --tls-san k3s: adds the compose service name to the apiserver
    # serving cert's SANs so the orchestrator container (see `app`
    # profile) can dial https://k3s:6443 over TLS without a cert
    # mismatch. Host-side kubectl keeps using https://127.0.0.1:6443
    # (already a SAN). Changing this regenerates the serving cert on the
    # next `up` for an existing k3s_data volume.
    command: ["server", "--disable=traefik", "--tls-san=k3s"]
    ports:
      - "6443:6443"
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "666"
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - ./.local/k3s-output:/output
      # Tells k3s's embedded containerd that the `registry` service
      # (reachable by compose DNS name on the shared default network) is
      # a plain-HTTP registry, not the TLS+auth every registry normally
      # needs -- otherwise containerd refuses to pull from it at all.
      - ./k3s-registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    depends_on:
      - registry
    profiles: ["dev-a", "full", "app"]   # not started by default `docker-compose up`

  # --- Application services (PHASE1_MVP_COMPLETION.md §1.1) ---------------
  # `docker compose --profile app up` brings these up on top of the infra
  # + dev-a services for a production-like, all-in-one bring-up. Images
  # are built from each service's own Dockerfile.

  # One-shot: rewrite the k3s kubeconfig so its `server:` points at the
  # compose-internal name `k3s:6443` (the on-disk one from K3S_KUBECONFIG_OUTPUT
  # targets 127.0.0.1:6443, which is only right for host-side kubectl).
  # Writes .local/k3s-output/kubeconfig.internal.yaml, which the
  # orchestrator service mounts.
  kubeconfig-internal:
    image: alpine:3
    depends_on:
      - k3s
    volumes:
      - ./.local/k3s-output:/output
    command:
      - /bin/sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do [ -f /output/kubeconfig.yaml ] && break; sleep 2; done
        sed 's#https://127.0.0.1:6443#https://k3s:6443#' /output/kubeconfig.yaml > /output/kubeconfig.internal.yaml
        echo "wrote /output/kubeconfig.internal.yaml"
    profiles: ["app"]

  # One-shot: apply Dev A's env/billing migrations (orchestrator/db/
  # migrations/*.sql) into the already-initdb'd database. Idempotent --
  # every statement in those files is CREATE ... IF NOT EXISTS -- so it is
  # safe to re-run on every `up`.
  db-migrate-orchestrator:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: practice
    volumes:
      - ./orchestrator/db/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          echo "applying $$f"
          psql -h postgres -U practice -d practice_engine -v ON_ERROR_STOP=1 -f "$$f"
        done
    profiles: ["app"]

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate-orchestrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      kubeconfig-internal:
        condition: service_completed_successfully
    environment:
      KUBECONFIG: /kube/kubeconfig.internal.yaml
      DATABASE_URL: postgres://practice:practice@postgres:5432/practice_engine
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      ORCHESTRATOR_GRPC_PORT: "50051"
      ORCHESTRATOR_WS_PORT: "8081"
      ORCHESTRATOR_METRICS_PORT: "9090"
      WS_GATEWAY_BASE_URL: ws://localhost:8081
      # Must match practice-core's JWT_SECRET below.
      WS_GATEWAY_JWT_SECRET: change-me-dev-only
      # Must match practice-core's ORCHESTRATOR_SHARED_SECRET below.
      ORCHESTRATOR_SHARED_SECRET: compose-dev-shared-secret
      ORCHESTRATOR_GVISOR_ENABLED: "false"
      DEFAULT_BUDGET_USD: "0.08"
      # Session recordings -> the compose minio.
      RECORDING_S3_BUCKET: practice-recordings
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: practice
      AWS_SECRET_ACCESS_KEY: practice-dev-only
      AWS_REGION: us-east-1
    ports:
      - "50051:50051"
      - "8081:8081"
      - "9090:9090"
    volumes:
      - ./.local/k3s-output:/kube:ro
    profiles: ["app"]

  practice-core:
    build:
      context: ./practice-core
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      orchestrator:
        condition: service_started
    environment:
      DATABASE_URL: postgres://practice:practice@postgres:5432/practice_engine
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      ORCHESTRATOR_GRPC_ADDRESS: orchestrator:50051
      USE_FAKE_ORCHESTRATOR: "false"
      ORCHESTRATOR_SHARED_SECRET: compose-dev-shared-secret
      JWT_SECRET: change-me-dev-only
    ports:
      - "3001:3001"
    # contracts/*.proto and content/* are resolved at runtime via
    # path.resolve(process.cwd(), '..', <subpath>) -- mount the repo's
    # copies one level above the app's WORKDIR (/app/practice-core).
    volumes:
      - ./contracts:/app/contracts:ro
      - ./content:/app/content:ro
    profiles: ["app"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Inlined at build time; must be the URL the host browser can
        # reach, not the compose service name.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    depends_on:
      practice-core:
        condition: service_started
    ports:
      - "3000:3000"
    profiles: ["app"]

volumes:
  pg_data:
  k3s_data:
  registry_data:
  minio_data:
